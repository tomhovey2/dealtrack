  .header { background: #1a2744; padding: 14px 16px 12px; padding-top: max(14px, env(safe-area-inset-top)); position: sticky; top: 0; z-index: 100; -webkit-transform: translateZ(0); transform: translateZ(0); }

  .search-wrap { position: relative; margin-top: 11px; }

  input[type=search]:focus { border-color: #c9a84c; background: rgba(255,255,255,0.18); }

  /* ── Groups: inset containers, status is the structure ── */
  .group { margin: 18px 12px 0; }
  .group-hdr { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 7px; }
  .group-name { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #1a2744; }
  .group-count { font-size: 10px; color: #a39c93; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .group-box { background: #ffffff; border: 1px solid #e4dfd6; border-radius: 10px; overflow: hidden; }

  /* Column ruler — labels the aligned metric columns once per group */
  .col-hdr { display: grid; grid-template-columns: 1fr 78px 68px; gap: 8px; padding: 7px 14px 6px; background: #faf8f5; border-bottom: 1px solid #eeeae3; }
  .col-hdr span { font-size: 8px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #b0a99f; text-align: right; }
  .col-hdr span:first-child { text-align: left; }

  /* ── Rows: every metric lands in the same column, every row ── */
  .row { display: block; padding: 10px 14px 11px; border-top: 1px solid #f0ece5; cursor: pointer; }
  .row:first-of-type { border-top: none; }
  .row:active { background: #f7f5f1; }
  .row-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .row-addr { font-size: 14px; font-weight: 600; color: #1a2744; line-height: 1.3; flex: 1; padding-top: 1px; }
  .row-priceblock { text-align: right; white-space: nowrap; }
  .row-price { font-size: 15px; font-weight: 700; color: #1a2744; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.15; }
  .row-psf { font-size: 10px; color: #a39c93; font-variant-numeric: tabular-nums; margin-top: 1px; letter-spacing: 0.01em; }
  .row-metrics { display: grid; grid-template-columns: 1fr 78px 68px; gap: 8px; align-items: baseline; }
  .row-metrics > div { font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: #6f6960; }
  .m-loc { text-align: left !important; color: #8a837a; overflow: hidden; text-overflow: ellipsis; }
  .m-sf { color: #6f6960; }
  .m-cap { font-weight: 600; }
  .cap-pos { color: #2d7a4f; }
  .cap-neg { color: #a83228; }
  .roc-tag { font-size: 8px; font-weight: 600; color: #a39c93; letter-spacing: 0.04em; margin-left: 2px; }
  .row-tenants { font-size: 11px; color: #6f6960; margin-top: 6px; line-height: 1.4; padding-left: 1px; }
  .row-tenants b { font-weight: 500; color: #40474f; }
  .row-vac { color: #a83228; font-weight: 600; }

  .empty { text-align: center; padding: 60px 20px; color: #9a948c; font-size: 13px; }
  .list-pad { padding-bottom: 90px; }

  /* ── Modal (unchanged behavior) ── */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(26,39,68,0.75); z-index: 999; display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: #ffffff; border-top: 3px solid #1a2744; border-radius: 16px 16px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 40px; animation: slideUp 0.2s ease; position: relative; z-index: 1000; }

  .modal-hdr { padding: 10px 16px 12px; border-bottom: 1px solid #e2ddd6; position: sticky; top: 0; background: #ffffff; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; }

  .modal-banner { padding: 16px; background: #1a2744; display: flex; justify-content: space-between; align-items: flex-end; }

  .modal-banner-val.med { font-size: 17px; color: rgba(255,255,255,0.9); text-align: right; }

  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-item.full { grid-column: 1/-1; }
  .modal-key { font-size: 9px; color: #8a8580; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }

  .tenant-table td { padding: 6px 6px; border-bottom: 1px solid #f0ede8; color: #1a1a1a; vertical-align: top; }

function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtM(n) { if(n==null||isNaN(n)) return '\u2014'; var a=Math.abs(n); return (n<0?'-':'')+(a>=1e9?'$'+(a/1e9).toFixed(2)+'B':a>=1e6?'$'+(a/1e6).toFixed(1)+'M':'$'+(a/1000).toFixed(0)+'K'); }
function fmtFull(n) { return n==null?'\u2014':'$'+Number(n).toLocaleString(); }
function fmtSf(n) { return n==null?'\u2014':Number(n).toLocaleString()+' SF'; }
function fmtPsf(n) { return n==null||isNaN(n)?'\u2014':'$'+Number(n).toFixed(0)+'/SF'; }
function fmtCap(l) { if(l.capRate==null) return '\u2014'; var pct=(l.capRate*100).toFixed(2)+'%'; return l.capRateNote ? pct+' '+l.capRateNote : pct; }
function fmtRent(n) { return n==null?'\u2014':'$'+Number(n).toFixed(2)+' NNN'; }
function isPortfolio(l) { return /portfolio/i.test(l.addr) || (l.buildings && l.buildings>1); }
function bldgLabel(l) { if (l.buildings) return l.buildings+' Building'+(l.buildings>1?'s':''); return isPortfolio(l) ? 'Portfolio' : null; }

var GROUPS = ['In The Market','Coming To Market','Off Market'];

function matches(l, q) {
  if (!q) return true;
  var parts = [l.addr, l.city, l.state, l.client];
  if (l.tenants) for (var i=0;i<l.tenants.length;i++) parts.push(l.tenants[i].name);
  return parts.map(function(v){return v||'';}).join(' ').toLowerCase().indexOf(q) !== -1;
}

      + '<div class="group-box">'
      + '<div class="col-hdr"><span>Location</span><span>Size</span><span>Cap</span></div>';

    for (var i=0; i<set.length; i++) {
      var l = set[i];
      var capCls = (l.capRate != null && l.capRate < 0) ? 'cap-neg' : 'cap-pos';
      var capTxt = (l.capRate == null) ? '\u2014' : (l.capRate*100).toFixed(2)+'%';
      if (l.capRateNote) capTxt += '<span class="roc-tag">'+esc(l.capRateNote)+'</span>';

      var loc = esc(l.city)+', '+esc(l.state);
      if (l.buildings && l.buildings > 1) loc += ' \u00b7 '+l.buildings+' bldgs';

      var tenantLine = '';
      if (l.tenants && l.tenants.length) {
        var names = [], vac = 0;
        for (var t=0; t<l.tenants.length; t++) {
          names.push(esc(l.tenants[t].name.split(' \u2014 ')[0]));
          if (l.tenants[t].vacant) vac += l.tenants[t].vacant;
        }
        tenantLine = '<div class="row-tenants"><b>'+names.join(' \u00b7 ')+'</b>';
        if (vac) tenantLine += ' <span class="row-vac">\u2014 '+vac.toLocaleString()+' SF vacant</span>';
        tenantLine += '</div>';
      }

      html += '<div class="row" onclick="openModal(\''+l.id+'\')">'
        + '<div class="row-main"><div class="row-addr">'+esc(l.addr)+'</div>'
        + '<div class="row-priceblock">'
        +   '<div class="row-price">'+fmtM(l.askingPrice)+'</div>'
        +   '<div class="row-psf">'+(l.psf?'$'+Number(l.psf).toFixed(0)+'/SF':'\u2014')+'</div>'
        + '</div></div>'
        + '<div class="row-metrics">'
        +   '<div class="m-loc">'+loc+'</div>'
        +   '<div class="m-sf">'+(l.sf?Number(l.sf).toLocaleString():'\u2014')+'</div>'
        +   '<div class="m-cap '+capCls+'">'+capTxt+'</div>'
        + '</div>'
        + tenantLine
        + '</div>';
    }

    html += '</div></div>';
  }

  document.getElementById('list').innerHTML = html || '<div class="empty">No listings match that search.</div>';

  var sf = 0, val = 0;
  for (var k=0; k<shown.length; k++) { sf += (shown[k].sf||0); val += (shown[k].askingPrice||0); }
  document.getElementById('hdr-totals').innerHTML = shown.length + ' LISTINGS \u00b7 '
    + (sf ? (sf/1e6).toFixed(2)+'M SF' : '\u2014') + ' \u00b7 ' + fmtM(val);
}

function openModal(id) {
  var l = null;
  for (var i=0;i<LISTINGS.length;i++) if (LISTINGS[i].id === id) l = LISTINGS[i];
  if (!l) return;

  var bl = bldgLabel(l);
  var bits = [l.city+', '+l.state, l.status];
  if (bl) bits.push(bl);
  if (l.tenants && l.tenants.length === 1) bits.push('Single Tenant');
  else if (l.tenants && l.tenants.length > 1) bits.push(l.tenants.length+' Tenants');

  var tenantSection = '';
  if (l.tenants && l.tenants.length) {
    var rows = '';
    for (var t=0; t<l.tenants.length; t++) {
      var tn = l.tenants[t];
      var vacantNote = tn.vacant ? ' <span class="vacant-flag">('+tn.vacant.toLocaleString()+' SF vacant)</span>' : '';
      rows += '<tr><td>'+esc(tn.name)+vacantNote+'</td><td>'+fmtSf(tn.sf)+'</td><td>'+esc(tn.exp||'\u2014')+'</td><td>'+fmtRent(tn.rent)+'</td></tr>';
    }
    var pctCls = (l.pctLeased!=null && l.pctLeased<100) ? 'partial' : 'full';
    tenantSection = '<div class="modal-section">'
      + '<div class="modal-section-title">Tenant Overview'+(l.pctLeased!=null?' \u00b7 <span class="pct-leased '+pctCls+'">'+l.pctLeased+'% Leased</span>':'')+'</div>'
      + '<table class="tenant-table"><thead><tr><th>Tenant</th><th>SF</th><th>Term</th><th>Rent</th></tr></thead><tbody>'
      + rows + '</tbody></table></div>';
  }

  var specsSection = '<div class="modal-section">'
    + '<div class="modal-section-title">Property Specs</div>'
    + '<div class="modal-grid">'
    +   '<div class="modal-item"><div class="modal-key">Building Size</div><div class="modal-val">'+fmtSf(l.sf)+'</div></div>'
    +   '<div class="modal-item"><div class="modal-key">Price / SF</div><div class="modal-val">'+fmtPsf(l.psf)+'</div></div>'
    +   '<div class="modal-item"><div class="modal-key">Cap Rate</div><div class="modal-val hi">'+fmtCap(l)+'</div></div>'
    +   '<div class="modal-item"><div class="modal-key">WALT</div><div class="modal-val">'+(l.walt!=null?l.walt+' yrs':'\u2014')+'</div></div>'
    +   (l.buildings ? '<div class="modal-item"><div class="modal-key">Buildings</div><div class="modal-val">'+l.buildings+'</div></div>' : '')
    +   (l.yearBuilt ? '<div class="modal-item"><div class="modal-key">Year Built</div><div class="modal-val">'+esc(l.yearBuilt)+'</div></div>' : '')
    +   (l.clearHeight ? '<div class="modal-item"><div class="modal-key">Clear Height</div><div class="modal-val">'+esc(l.clearHeight)+'</div></div>' : '')
    +   (l.inPlaceCap ? '<div class="modal-item"><div class="modal-key">In-Place Cap</div><div class="modal-val hi">'+(l.inPlaceCap*100).toFixed(2)+'%</div></div>' : '')
    +   (l.yearOneCap ? '<div class="modal-item"><div class="modal-key">Year 1 Cap</div><div class="modal-val hi">'+(l.yearOneCap*100).toFixed(2)+'%</div></div>' : '')
    +   (l.roc ? '<div class="modal-item"><div class="modal-key">ROC'+(l.rocNote?' ('+esc(l.rocNote)+')':'')+'</div><div class="modal-val hi">'+(l.roc*100).toFixed(2)+'%</div></div>' : '')
    + '</div></div>';

  var dealSection = '<div class="modal-section">'
    + '<div class="modal-section-title">Deal Info</div>'
    + '<div class="modal-grid"><div class="modal-item full"><div class="modal-key">Client / Owner</div><div class="modal-val">'+esc(l.client||'\u2014')+'</div></div></div>'
    + '</div>';

  var notesSection = l.notes ? ('<div class="modal-section"><div class="modal-section-title">Notes</div><div class="notes-box">'+esc(l.notes)+'</div></div>') : '';

  document.getElementById('modal').innerHTML = '<div class="modal-handle"></div>'
    + '<div class="modal-hdr"><div><div class="modal-title">'+esc(l.addr)+'</div>'
    + '<div class="modal-subtitle">'+esc(bits.join(' \u00b7 '))+'</div></div>'
    + '<button class="modal-close" onclick="closeModalBtn()">&#x2715;</button></div>'
    + '<div class="modal-banner"><div><div class="modal-banner-lbl">Asking Price</div>'
    + '<div class="modal-banner-val big">'+fmtM(l.askingPrice)+'</div></div>'
    + '<div><div class="modal-banner-lbl">Full Price</div><div class="modal-banner-val med">'+fmtFull(l.askingPrice)+'</div></div></div>'
    + '<div class="modal-body">' + dealSection + specsSection + tenantSection + notesSection + '</div>';

  var overlay = document.getElementById('modal-overlay');
  overlay.style.display = 'flex';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModalBtn() {
  var o = document.getElementById('modal-overlay');
  o.classList.remove('open');
  o.style.display = 'none';
  document.body.style.overflow = '';
}
function closeModal(e) { if (e.target.id === 'modal-overlay') closeModalBtn(); }

document.getElementById('search').addEventListener('input', render);
render();
</script>
</body>
</html>
