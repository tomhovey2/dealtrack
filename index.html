<style>
  :root {
    color-scheme: light only;
    --bg: #f4f2ee;
    --surface: #ffffff;
    --surface2: #f9f8f5;
    --border: #e2ddd6;
    --navy: #1a2744;
    --gold: #b8913a;
    --green: #2d7a4f;
    --red: #a83228;
    --text: #1a1a1a;
    --muted: #8a8580;
    --light: #c8c3bb;
    --blue: #2c5f8a;
    --purple: #6b3fa0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: #1a2744; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  .header {
    background: #1a2744 !important;
    padding: 14px 16px 12px;
    padding-top: max(14px, env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 100;
    isolation: isolate;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
  }
  .header h1 {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  .header p {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 68px;
    z-index: 90;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .filters::-webkit-scrollbar { display: none; }
  .fpill {
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    min-height: 40px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .fpill.active {
    background: var(--navy) !important;
    border-color: var(--navy) !important;
    color: #ffffff !important;
  }

  .list { padding: 4px 16px 40px; }

  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 2px 10px;
  }
  .section-divider .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .section-divider .dot.market { background: var(--green); }
  .section-divider .dot.coming { background: var(--gold); }
  .section-divider .dot.off { background: var(--muted); }
  .section-divider .dot.uc { background: var(--blue); }
  .section-divider .dot.awarded { background: var(--purple); }
  .section-divider h2 {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--navy);
  }
  .section-divider .count {
    margin-left: auto;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .card-title {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.25;
  }
  .card-loc {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-price-block {
    text-align: right;
    flex-shrink: 0;
  }
  .card-price {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
  }
  .card-psf {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .metric {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .metric:not(:first-child) {
    border-left: 1px solid var(--border);
    padding-left: 10px;
    margin-left: -1px;
  }
  .metric-label {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    color: var(--light);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .metric-val {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .metric-val.cap-pos { color: var(--green); }
  .metric-val.cap-neg { color: var(--red); }
  .metric-val.tbd { color: var(--muted); font-style: italic; font-weight: 500; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }

  .card {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .1s, box-shadow .1s;
  }
  .card:active {
    transform: scale(0.985);
    background: var(--surface2);
  }
  .card-chevron {
    color: var(--light);
    font-size: 18px;
    margin-left: 6px;
    flex-shrink: 0;
    align-self: center;
  }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26,39,68,0.5);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 88vh;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    z-index: 201;
    transform: translateY(100%);
    transition: transform .25s cubic-bezier(.32,.72,0,1);
    display: flex;
    flex-direction: column;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
  }
  .sheet.open {
    transform: translateY(0);
  }
  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--light);
    border-radius: 2px;
    margin: 10px auto 4px;
    flex-shrink: 0;
  }
  .sheet-header {
    padding: 10px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sheet-status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .sheet-status-badge {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 3px 9px;
    border-radius: 10px;
    color: #fff;

  .sheet-close {

    height: 30px;

  .sheet-loc {

    color: var(--muted);
    margin-top: 4px;

  .sheet-price-row {

    margin-top: 14px;
  }
  .sheet-price-item .val {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--navy);

  .sheet-body {

    padding: 16px 20px 32px;

  .sheet-section-title {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 18px 0 10px;

    display: flex;
    flex-direction: column;

    line-height: 1.4;
    padding-left: 16px;
    position: relative;
  }

    content: "";
    position: absolute;
    left: 0;
    top: 7px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
  }
  .sheet-specs {

    flex-direction: column;
  }

    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .sheet-spec-row:last-child { border-bottom: none; }
  .sheet-metrics .sheet-spec-row {
    flex-direction: column;
    gap: 3px;

  .sheet-metrics .sheet-spec-label {
    width: 100%;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;

    font-weight: 500;
    line-height: 1.4;

  .sheet-spec-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;

  .sheet-empty {

    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    text-align: center;
    padding: 20px 0 8px;

const SECTION_ORDER = ["AWARDED","UNDER CONTRACT","IN THE MARKET","COMING TO MARKET","OFF MARKET"];
const SECTION_META = {
  "UNDER CONTRACT":  { label: "Under Contract",    dot: "uc" },
  "AWARDED":         { label: "Awarded",           dot: "awarded" },
  "IN THE MARKET":   { label: "In The Market",    dot: "market" },
  "COMING TO MARKET":{ label: "Coming To Market",  dot: "coming" },
  "OFF MARKET":      { label: "Off Market",        dot: "off" }
};

function capClass(cap) {
  if (cap === "TBD" || cap.trim().toLowerCase() === "vacant") return "tbd";
  if (cap.trim().startsWith("-")) return "cap-neg";
  return "cap-pos";
}
function valClass(v) {
  return v === "TBD" ? "tbd" : "";
}

function render(filter) {
  const list = document.getElementById('list');
  const groups = {};
  SECTION_ORDER.forEach(s => groups[s] = []);
  LISTINGS.forEach(l => { if (filter === 'all' || l.status === filter) groups[l.status].push(l); });

  let html = '';
  let anyResults = false;
  SECTION_ORDER.forEach(status => {
    const items = groups[status];
    if (!items.length) return;
    anyResults = true;
    const meta = SECTION_META[status];
    html += `<div class="section-divider">
      <div class="dot ${meta.dot}"></div>
      <h2>${meta.label}</h2>
      <div class="count">${items.length}</div>
    </div>`;
    items.forEach(l => {
      html += `<div class="card" data-name="${l.name.replace(/"/g, '&quot;')}">
        <div class="card-top">
          <div>
            <div class="card-title">${l.name}</div>
            <div class="card-loc">${l.city}, ${l.state}</div>
          </div>
          <div class="card-price-block">
            <div class="card-price">${l.price}</div>
            <div class="card-psf">${l.psf}</div>
          </div>
          <div class="card-chevron">›</div>
        </div>
        <div class="metric-grid">
          <div class="metric">
            <div class="metric-label">Buyer</div>
            <div class="metric-val ${valClass(l.buyer || 'TBD')}">${l.buyer || 'TBD'}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Size</div>
            <div class="metric-val ${valClass(l.size)}">${l.size}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Cap Rate</div>
            <div class="metric-val ${capClass(l.cap)}">${l.cap}</div>
          </div>
        </div>
      </div>`;
    });
  });

  if (!anyResults) {
    html = `<div class="empty">No listings in this category right now.</div>`;
  }
  list.innerHTML = html;
}

document.getElementById('filters').addEventListener('click', (e) => {
  const pill = e.target.closest('.fpill');
  if (!pill) return;
  document.querySelectorAll('.fpill').forEach(p => p.classList.toggle('active', p === pill));
  render(pill.dataset.val);
});

const STATUS_COLOR = {
  "UNDER CONTRACT": "var(--blue)",
  "AWARDED": "var(--purple)",
  "IN THE MARKET": "var(--green)",
  "COMING TO MARKET": "var(--gold)",
  "OFF MARKET": "var(--muted)"
};

const sheet = document.getElementById('sheet');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetHeader = document.getElementById('sheetHeader');
const sheetBody = document.getElementById('sheetBody');

function openSheet(name) {
  const l = LISTINGS.find(x => x.name === name);
  if (!l) return;
  const d = DEAL_DETAILS[name];
  const meta = SECTION_META[l.status];

  sheetHeader.innerHTML = `
    <div class="sheet-status-row">
      <div class="sheet-status-badge" style="background:${STATUS_COLOR[l.status] || 'var(--muted)'}">${meta ? meta.label : l.status}</div>
      <div class="sheet-close" id="sheetClose">✕</div>
    </div>
    <div class="sheet-title">${l.name}</div>
    ${d && d.subtitle ? `<div class="sheet-subtitle">${d.subtitle}</div>` : ''}
    <div class="sheet-loc">${l.city}, ${l.state}</div>
    <div class="sheet-price-row">
      <div class="sheet-price-item">
        <div class="val">${l.price}</div>
        <div class="lbl">Price</div>
      </div>
      <div class="sheet-price-item">
        <div class="val">${l.psf}</div>
        <div class="lbl">Price / SF</div>
      </div>
      <div class="sheet-price-item">
        <div class="val ${capClass(l.cap)}">${l.cap}</div>
        <div class="lbl">Cap Rate</div>
      </div>
      <div class="sheet-price-item">
        <div class="val" style="font-size:15px;">${l.buyer || 'TBD'}</div>
        <div class="lbl">Buyer</div>
      </div>
    </div>
  `;

  let bodyHtml = '';
  if (d) {
    if (d.metrics && d.metrics.length) {
      bodyHtml += `<div class="sheet-section-title">Key Metrics</div>
        <div class="sheet-specs sheet-metrics">${d.metrics.map(([k,v]) => `
          <div class="sheet-spec-row">
            <div class="sheet-spec-label">${k}</div>
            <div class="sheet-spec-val">${v}</div>
          </div>`).join('')}</div>`;
    }
    if (d.specs && d.specs.length) {
      bodyHtml += `<div class="sheet-section-title">Property Specs</div>
        <div class="sheet-specs">${d.specs.map(([k,v]) => `
          <div class="sheet-spec-row">
            <div class="sheet-spec-label">${k}</div>
            <div class="sheet-spec-val">${v}</div>
          </div>`).join('')}</div>`;
    }
    if (d.market) {
      bodyHtml += `<div class="sheet-section-title">Market Context</div>
        <div class="sheet-market">${d.market}</div>`;
    }
  } else {
    bodyHtml = `<div class="sheet-empty">Full property package not yet loaded for this listing.<br>Contact your JLL team for details.</div>`;
  }
  sheetBody.innerHTML = bodyHtml;

  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  sheet.classList.add('open');
  sheetBackdrop.classList.add('open');
}

function closeSheet() {
  sheet.classList.remove('open');
  sheetBackdrop.classList.remove('open');
}

document.getElementById('list').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  openSheet(card.dataset.name);
});

sheetBackdrop.addEventListener('click', closeSheet);

render('all');
</script>
