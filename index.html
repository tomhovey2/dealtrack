<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#1a2744">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Active Listings — JLL Boston Industrial</title>
<style>
  :root {
    color-scheme: light only;
    --bg: #f4f2ee;
    --surface: #ffffff;
    --surface2: #f9f8f5;
    --border: #e2ddd6;
    --navy: #1a2744;
    --gold: #b8913a;
    --green: #2d7a4f;
    --red: #a83228;
    --text: #1a1a1a;
    --muted: #8a8580;
    --light: #c8c3bb;
    --blue: #2c5f8a;
    --purple: #6b3fa0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: #1a2744; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  .header {
    background: #1a2744 !important;
    padding: 14px 16px 12px;
    padding-top: max(14px, env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 100;
    isolation: isolate;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
  }
  .header h1 {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  .header p {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 68px;
    z-index: 90;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .filters::-webkit-scrollbar { display: none; }
  .fpill {
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    min-height: 40px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .fpill.active {
    background: var(--navy) !important;
    border-color: var(--navy) !important;
    color: #ffffff !important;
  }

  .list { padding: 4px 16px 40px; }

  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 2px 10px;
  }
  .section-divider .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .section-divider .dot.market { background: var(--green); }
  .section-divider .dot.coming { background: var(--gold); }
  .section-divider .dot.off { background: var(--muted); }
  .section-divider .dot.uc { background: var(--blue); }
  .section-divider .dot.awarded { background: var(--purple); }
  .section-divider h2 {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--navy);
  }
  .section-divider .count {
    margin-left: auto;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .card-title {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.25;
  }
  .card-loc {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-price-block {
    text-align: right;
    flex-shrink: 0;
  }
  .card-price {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
  }
  .card-psf {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .metric {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .metric:not(:first-child) {
    border-left: 1px solid var(--border);
    padding-left: 10px;
    margin-left: -1px;
  }
  .metric-label {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    color: var(--light);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .metric-val {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .metric-val.cap-pos { color: var(--green); }
  .metric-val.cap-neg { color: var(--red); }
  .metric-val.tbd { color: var(--muted); font-style: italic; font-weight: 500; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Active Listings</h1>
  <p>JLL Boston Industrial</p>
</div>

<div class="filters" id="filters">
  <div class="fpill active" data-val="all">All</div>
  <div class="fpill" data-val="IN THE MARKET">In The Market</div>
  <div class="fpill" data-val="COMING TO MARKET">Coming To Market</div>
  <div class="fpill" data-val="OFF MARKET">Off Market</div>
  <div class="fpill" data-val="UNDER CONTRACT">Under Contract</div>
  <div class="fpill" data-val="AWARDED">Awarded</div>
</div>

<div class="list" id="list"></div>

<script>
const LISTINGS = [
  {"status": "IN THE MARKET", "name": "41 Progress Dr", "city": "Manchester", "state": "CT", "price": "$8.05M", "psf": "$117/SF", "size": "69,000 SF", "cap": "6.75%", "buyer": "Fairview"},
  {"status": "IN THE MARKET", "name": "525 Myles Standish", "city": "Taunton", "state": "MA", "price": "$12.5M", "psf": "$100/SF", "size": "124,991 SF", "cap": "7.50% ROC", "buyer": null},
  {"status": "IN THE MARKET", "name": "Brookfield / Calare South Boston Portfolio", "city": "Various", "state": "MA", "price": "$101.66M", "psf": "$210/SF", "size": "483,096 SF", "cap": "5.59%", "buyer": null},
  {"status": "COMING TO MARKET", "name": "101 Almgren Dr", "city": "Agawam", "state": "MA", "price": "$15.5M", "psf": "$83/SF", "size": "187,840 SF", "cap": "6.67%", "buyer": null},
  {"status": "COMING TO MARKET", "name": "27 Forge Parkway", "city": "Franklin", "state": "MA", "price": "$14.11M", "psf": "$128/SF", "size": "109,838 SF", "cap": "7.75% ROC", "buyer": null},
  {"status": "COMING TO MARKET", "name": "38 Neponset Ave", "city": "Foxboro", "state": "MA", "price": "$14M", "psf": "TBD", "size": "TBD", "cap": "7.50% ROC Industrial / 6.40% ROC Multi", "buyer": null},
  {"status": "COMING TO MARKET", "name": "50 Nagog", "city": "Acton", "state": "MA", "price": "$31.36M", "psf": "$263/SF", "size": "119,060 SF", "cap": "6.09%", "buyer": null},
  {"status": "COMING TO MARKET", "name": "8 Centennial & 600 Friberg", "city": "Shrewsbury / Westborough", "state": "MA", "price": "TBD", "psf": "TBD", "size": "TBD", "cap": "TBD", "buyer": null},
  {"status": "COMING TO MARKET", "name": "90 Huntoon Memorial", "city": "Leicester", "state": "MA", "price": "$38M", "psf": "$142/SF", "size": "267,600 SF", "cap": "-2.38%", "buyer": null},
  {"status": "COMING TO MARKET", "name": "Brookfield Concord St", "city": "North Reading", "state": "MA", "price": "$90M", "psf": "$318/SF", "size": "283,466 SF", "cap": "4.49%", "buyer": null},
  {"status": "COMING TO MARKET", "name": "Brookfield Dunham Portfolio", "city": "Billerica", "state": "MA", "price": "TBD", "psf": "TBD", "size": "TBD", "cap": "TBD", "buyer": null},
  {"status": "COMING TO MARKET", "name": "Garelick Land", "city": "Franklin", "state": "MA", "price": "TBD", "psf": "TBD", "size": "TBD", "cap": "TBD", "buyer": null},
  {"status": "OFF MARKET", "name": "176 1st Flight Dr", "city": "Auburn", "state": "ME", "price": "$5.9M", "psf": "$96/SF", "size": "61,188 SF", "cap": "8.67%", "buyer": null},
  {"status": "OFF MARKET", "name": "50 Shrewsbury (Loomis)", "city": "Boylston", "state": "MA", "price": "$7.45M", "psf": "$135/SF", "size": "55,175 SF", "cap": "7.13%", "buyer": null},
  {"status": "OFF MARKET", "name": "7 Campanelli Dr", "city": "Assonet", "state": "MA", "price": "$8.53M", "psf": "$17/SF", "size": "500,000 SF", "cap": "7.00% ROC", "buyer": null},
  {"status": "UNDER CONTRACT", "name": "300 Bartlett St", "city": "Northborough", "state": "MA", "price": "$36M", "psf": "$661/SF", "size": "54,504 SF", "cap": "5.75%", "buyer": "LaSalle"},
  {"status": "UNDER CONTRACT", "name": "13 Page Rd", "city": "Londonderry", "state": "NH", "price": "$16.5M", "psf": "$219/SF", "size": "75,480 SF", "cap": "6.30%", "buyer": null},
  {"status": "UNDER CONTRACT", "name": "80 South St", "city": "Hopkinton", "state": "MA", "price": "$9.5M", "psf": "$61/SF", "size": "154,604 SF", "cap": "7.75% ROC", "buyer": "Moxie Equities"},
  {"status": "UNDER CONTRACT", "name": "545 Washington St", "city": "Wrentham", "state": "MA", "price": "$35M", "psf": "$265/SF", "size": "132,055 SF", "cap": "5.50%", "buyer": "BGO"},
  {"status": "UNDER CONTRACT", "name": "145 Commerce", "city": "Warwick", "state": "RI", "price": "$73.25M", "psf": "$149/SF", "size": "491,496 SF", "cap": "6.40%", "buyer": "Apollo"},
  {"status": "UNDER CONTRACT", "name": "12 St Mark", "city": "Auburn", "state": "MA", "price": "$7.15M", "psf": "$109/SF", "size": "65,802 SF", "cap": "7.75% ROC", "buyer": "Parsons"},
  {"status": "UNDER CONTRACT", "name": "101 Concord St", "city": "Pawtucket", "state": "RI", "price": "$3.8M", "psf": "$143/SF", "size": "26,600 SF", "cap": "6.75%", "buyer": "Catalyst"},
  {"status": "AWARDED", "name": "16 Delta & 5A/5B Aviation", "city": "Londonderry", "state": "NH", "price": "$43.3M", "psf": "$247/SF", "size": "175,345 SF", "cap": "6.15%", "buyer": "Morgan Stanley"},
  {"status": "AWARDED", "name": "Upton Dr Portfolio", "city": "Wilmington", "state": "MA", "price": "$30M", "psf": "$266/SF", "size": "112,776 SF", "cap": "TBD", "buyer": "Camber"}
];

const SECTION_ORDER = ["UNDER CONTRACT","AWARDED","IN THE MARKET","COMING TO MARKET","OFF MARKET"];
const SECTION_META = {
  "UNDER CONTRACT":  { label: "Under Contract",    dot: "uc" },
  "AWARDED":         { label: "Awarded",           dot: "awarded" },
  "IN THE MARKET":   { label: "In The Market",    dot: "market" },
  "COMING TO MARKET":{ label: "Coming To Market",  dot: "coming" },
  "OFF MARKET":      { label: "Off Market",        dot: "off" }
};

function capClass(cap) {
  if (cap === "TBD" || cap.trim().toLowerCase() === "vacant") return "tbd";
  if (cap.trim().startsWith("-")) return "cap-neg";
  return "cap-pos";
}
function valClass(v) {
  return v === "TBD" ? "tbd" : "";
}

function render(filter) {
  const list = document.getElementById('list');
  const groups = {};
  SECTION_ORDER.forEach(s => groups[s] = []);
  LISTINGS.forEach(l => { if (filter === 'all' || l.status === filter) groups[l.status].push(l); });

  let html = '';
  let anyResults = false;
  SECTION_ORDER.forEach(status => {
    const items = groups[status];
    if (!items.length) return;
    anyResults = true;
    const meta = SECTION_META[status];
    html += `<div class="section-divider">
      <div class="dot ${meta.dot}"></div>
      <h2>${meta.label}</h2>
      <div class="count">${items.length}</div>
    </div>`;
    items.forEach(l => {
      html += `<div class="card">
        <div class="card-top">
          <div>
            <div class="card-title">${l.name}</div>
            <div class="card-loc">${l.city}, ${l.state}</div>
          </div>
          <div class="card-price-block">
            <div class="card-price">${l.price}</div>
            <div class="card-psf">${l.psf}</div>
          </div>
        </div>
        <div class="metric-grid">
          <div class="metric">
            <div class="metric-label">Buyer</div>
            <div class="metric-val ${valClass(l.buyer || 'TBD')}">${l.buyer || 'TBD'}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Size</div>
            <div class="metric-val ${valClass(l.size)}">${l.size}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Cap Rate</div>
            <div class="metric-val ${capClass(l.cap)}">${l.cap}</div>
          </div>
        </div>
      </div>`;
    });
  });

  if (!anyResults) {
    html = `<div class="empty">No listings in this category right now.</div>`;
  }
  list.innerHTML = html;
}

document.getElementById('filters').addEventListener('click', (e) => {
  const pill = e.target.closest('.fpill');
  if (!pill) return;
  document.querySelectorAll('.fpill').forEach(p => p.classList.toggle('active', p === pill));
  render(pill.dataset.val);
});

render('all');
</script>

</body>
</html>
